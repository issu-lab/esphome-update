automation:
  - id: esphome_update_daily
    alias: "ESPHome Update — Daily check"
    description: "Installs available ESPHome device and add-on updates every day."
    triggers:
      - trigger: time
        at: "01:00:00"
    actions:
      - action: script.esphome_update_all
    mode: single

script:
  esphome_update_all:
    alias: "ESPHome Update — Install all available updates"
    description: "Updates ESPHome devices first and the ESPHome add-on last."
    mode: single
    sequence:
      # -----------------------------------------------------------------------
      # Configuration
      # -----------------------------------------------------------------------
      - variables:
          # Leave empty to disable notifications.
          # Example: notify.mobile_app_your_phone
          notification_action: ""

          # Send a notification even when no update is available.
          notify_when_no_updates: false

          # Change this only if your ESPHome add-on update entity uses
          # a different entity ID. Leave empty to exclude the add-on.
          esphome_addon_entity_id: "update.esphome_update"

          # Maximum time allowed for each update to finish.
          update_timeout: "00:05:00"

          # Pause between two consecutive updates.
          delay_between_updates: 5

      - alias: "Find available ESPHome updates"
        variables:
          esphome_device_updates: >-
            {{ states.update
                | selectattr('state', 'eq', 'on')
                | selectattr('entity_id', 'in', integration_entities('esphome'))
                | map(attribute='entity_id')
                | list }}

          esphome_addon_updates: >-
            {% if esphome_addon_entity_id | trim
                  and states(esphome_addon_entity_id) == 'on' %}
              {{ [esphome_addon_entity_id] }}
            {% else %}
              {{ [] }}
            {% endif %}

          available_updates: >-
            {{ (esphome_device_updates + esphome_addon_updates)
                | unique
                | list }}

      - alias: "Stop when no update is available"
        if:
          - condition: template
            value_template: "{{ available_updates | length == 0 }}"
        then:
          - alias: "Optionally report that everything is current"
            if:
              - condition: template
                value_template: >-
                  {{ notification_action | trim != ''
                      and notify_when_no_updates | bool }}
            then:
              - action: "{{ notification_action }}"
                data:
                  title: "ESPHome Update"
                  message: "All ESPHome devices and components are up to date."

          - stop: "No ESPHome updates available."

      - alias: "Initialize result lists"
        variables:
          updated_entities: []
          failed_entities: []

      - alias: "Install updates sequentially"
        repeat:
          for_each: "{{ available_updates }}"
          sequence:
            - variables:
                current_entity: "{{ repeat.item }}"
                current_name: >-
                  {{ state_attr(repeat.item, 'friendly_name') or repeat.item }}

            - alias: "Install current update"
              action: update.install
              target:
                entity_id: "{{ current_entity }}"
              continue_on_error: true

            - alias: "Wait for the update to complete"
              wait_template: "{{ is_state(current_entity, 'off') }}"
              timeout: "{{ update_timeout }}"
              continue_on_timeout: true

            - alias: "Record the result"
              if:
                - condition: template
                  value_template: "{{ is_state(current_entity, 'off') }}"
              then:
                - variables:
                    updated_entities: >-
                      {{ updated_entities + [current_name] }}
              else:
                - variables:
                    failed_entities: >-
                      {{ failed_entities + [current_name] }}

            - delay:
                seconds: "{{ delay_between_updates }}"

      - alias: "Optionally send the final result"
        if:
          - condition: template
            value_template: "{{ notification_action | trim != '' }}"
        then:
          - action: "{{ notification_action }}"
            data:
              title: "ESPHome Update"
              message: >-
                {% if updated_entities %}
                Updated successfully:
                {{ updated_entities | join('\n') }}
                {% endif %}
                {% if failed_entities %}
                {% if updated_entities %}{{ '\n\n' }}{% endif %}
                Failed or timed out:
                {{ failed_entities | join('\n') }}
                {% endif %}
